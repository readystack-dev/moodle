; priority=99
; Moodle 5.2 PHP requirements (admin/environment.xml). max_input_vars is PHP_INI_PERDIR
; (cannot be set at runtime via -d/ini_set) so it MUST live in an ini file the CLI + Apache
; SAPIs both load (phpenmod moodle links this file into both conf.d directories). The install.php env check hard-fails if max_input_vars < 5000.
max_input_vars=5000
memory_limit=256M
upload_max_filesize=200M
post_max_size=210M
max_execution_time=300
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
